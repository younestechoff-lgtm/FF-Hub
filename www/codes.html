<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090d">
  <title>FF Hub - الأكواد</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="app">

<header class="header">
  <div>
    <span class="welcome">FF HUB</span>
    <h2>أكواد الاسترداد</h2>
  </div>

  <button class="icon-button" onclick="location.href='index.html'">←</button>
</header>

<section class="hero">
  <span class="hero-label">REDEEM CODES</span>
  <h1>أكواد فري فاير</h1>
  <p>ابحث عن الكود وانسخه بضغطة واحدة.</p>
</section>

</div>

<div class="code-search">
  <input
    id="searchInput"
    type="search"
    placeholder="ابحث عن كود..."
    oninput="filterCodes()">
</div>

<div class="code-filters">
  <button class="filter active-filter" onclick="filterStatus('all', this)">الكل</button>
  <button class="filter" onclick="filterStatus('available', this)">🟢 متاح</button>
  <button class="filter" onclick="filterStatus('expired', this)">🔴 منتهي</button>
  <button class="filter" onclick="filterStatus('unknown', this)">🟡 غير مؤكد</button>
</div>

<h3 class="section-title">الأكواد</h3>

<div id="codesList" class="codes-list">

<script>

const codes = [

["FFHUB-Y6K1-M8Q5","expired"],
["FFHUB-Z4L7-V2N9","available"],
["FFHUB-A8P5-R3K6","unknown"]
];

const statusInfo = {
  available: ["🟢 متاح", "active"],
  expired: ["🔴 منتهي", "expired-status"],
  unknown: ["🟡 غير مؤكد", "unknown-status"]
};

document.write(
  codes.map((item, index) => {

    const code = item[0];
    const status = item[1];

    return `
      <div class="code-card ${status === "expired" ? "expired" : ""}"
           data-status="${status}"
           data-code="${code}">

        <div class="code-top">

          <span class="code-status ${statusInfo[status][1]}">
            ${statusInfo[status][0]}
          </span>

          <span class="code-reward">
            🎁 مكافأة غير محددة
          </span>

        </div>

        <div class="code-value">
          ${code}
        </div>

        ${
          status === "expired"
          ?
          `<button class="copy-button" disabled>منتهي</button>`
          :
          `<button class="copy-button" onclick="copyCode(this)">
             نسخ الكود
           </button>`
        }

      </div>
    `;
  }).join("")
);

</script>

</div>

<p id="noResults" class="no-results hidden">
  لا توجد نتائج.
</p>

</main>

<script>

let currentStatus = "all";

function filterCodes() {

  const search = document
    .getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();

  let visible = 0;

  document.querySelectorAll(".code-card").forEach(card => {

    const code = card.dataset.code.toLowerCase();
    const status = card.dataset.status;

    const matchSearch = code.includes(search);

    const matchStatus =
      currentStatus === "all" ||
      status === currentStatus;

    if (matchSearch && matchStatus) {
      card.style.display = "";
      visible++;
    } else {
      card.style.display = "none";
    }

  });

  document.getElementById("noResults")
    .classList.toggle("hidden", visible !== 0);
}

function filterStatus(status, button) {

  currentStatus = status;

  document.querySelectorAll(".filter").forEach(btn => {
    btn.classList.remove("active-filter");
  });

  button.classList.add("active-filter");

  filterCodes();
}

function copyCode(button) {

  const code = button
    .parentElement
    .querySelector(".code-value")
    .textContent
    .trim();

  navigator.clipboard.writeText(code).then(() => {

    const oldText = button.textContent;

    button.textContent = "تم النسخ ✓";

    setTimeout(() => {
      button.textContent = oldText;
    }, 1500);

  });

}

</script>

</body>
</html>

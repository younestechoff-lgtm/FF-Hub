<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090d">
  <title>FF Hub - الأدوات</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="app">

<header class="header">
  <div>
    <span class="welcome">FF HUB</span>
    <h2>الأدوات</h2>
  </div>

  <button class="icon-button" onclick="location.href='index.html'">←</button>
</header>

<section class="hero">
  <span class="hero-label">TOOLS</span>
  <h1>أدوات فري فاير</h1>
  <p>مجموعة أدوات بسيطة تساعدك في تطوير تجربة اللعب.</p>
</section>

<h3 class="section-title">اختر أداة</h3>

<div class="tools-grid">

  <button class="tool-card" onclick="location.href='name-generator.html'">
    <span class="tool-number">01</span>
    <div class="tool-content">
      <strong>مولّد أسماء</strong>
      <small>أنشئ أسماء مميزة ومزخرفة</small>
    </div>
    <span class="tool-arrow">←</span>
  </button>

  <button class="tool-card" onclick="location.href='name-decorate.html'">
    <span class="tool-number">02</span>
    <div class="tool-content">
      <strong>مولّد زخارف</strong>
      <small>زخرف اسمك بسهولة</small>
    </div>
    <span class="tool-arrow">←</span>
  </button>

  <button class="tool-card" onclick="location.href='sensitivity.html'">
    <span class="tool-number">03</span>
    <div class="tool-content">
      <strong>حاسبة الحساسية</strong>
      <small>إعدادات حساسية مخصصة</small>
    </div>
    <span class="tool-arrow">←</span>
  </button>

  <button class="tool-card" onclick="location.href='accuracy.html'">
    <span class="tool-number">04</span>
    <div class="tool-content">
      <strong>حاسبة الدقة</strong>
      <small>احسب نسبة دقتك</small>
    </div>
    <span class="tool-arrow">←</span>
  </button>

</div>

</main>

</body>
</html>
